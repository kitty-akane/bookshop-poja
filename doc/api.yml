openapi: 3.0.3
info:
  title: Bookshop API
  description: API for managing everything about a library - authors, books, book copies, customers, sales and stock.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server
tags:
  - name: Author
    description: Everything about authors
  - name: Book
    description: Everything about books
  - name: BookCopy
    description: Everything about book copies
  - name: Customer
    description: Everything about customers
  - name: Sale
    description: Everything about sales
  - name: Stock
    description: Everything about stock
paths:
  /authors:
    get:
      tags: [Authors]
      summary: List all authors
      operationId: getAllAuthors
      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorDTO"
    post:
      tags: [Authors]
      summary: Create an author
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorDTO"
      responses:
        "200":
          description: Created author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorDTO"

  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get an author by id
      operationId: getAuthorById
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Author found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorDTO"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Authors]
      summary: Update an author
      operationId: updateAuthor
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorDTO"
      responses:
        "200":
          description: Updated author
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorDTO"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Authors]
      summary: Delete an author
      operationId: deleteAuthor
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /books:
    get:
      tags: [Books]
      summary: List all books
      operationId: getAllBooks
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookDTO"
    post:
      tags: [Books]
      summary: Create a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookDTO"
      responses:
        "200":
          description: Created book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDTO"

  /books/{id}:
    get:
      tags: [Books]
      summary: Get a book by id
      operationId: getBookById
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDTO"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Books]
      summary: Update a book (partial - only non-null fields are applied)
      operationId: updateBook
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookDTO"
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDTO"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Books]
      summary: Delete a book
      operationId: deleteBook
      parameters:
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /books/search/{value}:
    get:
      tags: [Books]
      summary: Search books by (partial) title
      operationId: searchBooks
      parameters:
        - name: value
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookDTO"

  /books/low-stock:
    get:
      tags: [Stock]
      summary: List books whose available stock is at or below a threshold
      operationId: getLowStockBooks
      parameters:
        - name: threshold
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: Low stock books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LowStockBookDTO"

  /books/{bookId}/stock:
    get:
      tags: [Stock]
      summary: Get aggregated stock for a book (all formats)
      operationId: getBookStock
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Stock summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDTO"

  /books/{bookId}/stock/{format}:
    get:
      tags: [Stock]
      summary: Get stock for a book filtered by format
      operationId: getBookStockByFormat
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: format
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Format"
      responses:
        "200":
          description: Stock summary for the given format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDTO"


components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExceptionBody"

  schemas:
    Format:
      type: string
      enum: [HARD_COVER, SOFT_COVER, POCKET]

    Status:
      type: string
      enum: [AVAILABLE, RESERVED, SOLD]

    ExceptionBody:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

    AuthorDTO:
      type: object
      properties:
        idAuthor:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        nationality:
          type: string
        birthDate:
          type: string
          format: date

    BookDTO:
      type: object
      properties:
        idBook:
          type: integer
          format: int64
        title:
          type: string
        isbn:
          type: string
        publicationDate:
          type: string
          format: date
        author:
          type: string
        publisher:
          type: string
        language:
          type: string
        category:
          type: string
        description:
          type: string